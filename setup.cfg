# ── Lint configuration ──────────────────────────────────────────────────────
# One command, one answer:  flake8
#
# E241/E272 (multiple spaces after ',' or ':') are DISABLED on purpose. This
# codebase aligns columns inside dict and table literals — bearing geometry,
# channel maps, published census counts — because a misaligned digit in a
# geometry table is a defect you can see, and pyflakes cannot. Alignment is
# load-bearing here, so the checker that objects to it is turned off rather
# than the alignment removed.
#
# E501 is set to 100 rather than 79. The house style wraps prose comments at
# 79, but a few signature lines and TikZ-adjacent strings read worse broken.
[flake8]
max-line-length = 100
extend-ignore = E241, E272, W503, W504
exclude = .venv,.git,__pycache__,build,dist,*.egg-info,data,runs
per-file-ignores =
    tools/preflight.py:F401
